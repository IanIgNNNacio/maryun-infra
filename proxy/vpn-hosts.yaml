# Nombres de dominio que funcionan SOLO dentro de la VPN.
#
# Idea: los registros DNS de estos nombres apuntan a 10.8.0.1 (la IP del
# servidor dentro de WireGuard). Quien no este conectado a la VPN resuelve una
# direccion privada y no llega a ninguna parte; quien si lo este entra por
# nombre y no tiene que acordarse de puertos.
#
# Doble cierre de seguridad:
#  1. El DNS apunta a una IP privada, asi que desde internet no hay ruta.
#  2. Ademas se exige que la peticion venga de 10.8.0.0/24, por si algun dia
#     alguien apunta uno de estos nombres a la IP publica por error.
#
# Los servicios se referencian por 10.8.0.1:<puerto> en vez de por nombre de
# contenedor porque coolify-proxy vive en la red 'coolify' y estos servicios en
# la red 'data': no se alcanzan por nombre. Usar la IP de la VPN evita tener
# que unir las dos redes solo para esto.

http:
  middlewares:
    solo-vpn:
      ipAllowList:
        sourceRange:
          - 10.8.0.0/24

  routers:
    metabase-vpn:
      rule: "Host(`metabase.maryun.cl`) || Host(`reportes.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: metabase-vpn

    superset-vpn:
      rule: "Host(`superset.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: superset-vpn

    mage-vpn:
      rule: "Host(`mage.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: mage-vpn

    coolify-vpn:
      rule: "Host(`coolify.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: coolify-vpn

    monitoreo-vpn:
      rule: "Host(`monitoreo.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: kuma-vpn

    metricas-vpn:
      rule: "Host(`metricas.maryun.cl`)"
      entryPoints: [http]
      middlewares: [solo-vpn]
      service: beszel-vpn

  services:
    metabase-vpn:
      loadBalancer:
        servers: [{ url: "http://10.8.0.1:3000" }]
    superset-vpn:
      loadBalancer:
        servers: [{ url: "http://10.8.0.1:8088" }]
    mage-vpn:
      loadBalancer:
        servers: [{ url: "http://10.8.0.1:6789" }]
    coolify-vpn:
      loadBalancer:
        servers: [{ url: "http://coolify:8080" }]
    # Uptime Kuma y Coolify comparten la red 'coolify' con el proxy, asi que se
    # alcanzan por nombre de contenedor. Por la IP de la VPN se colgaban: el
    # trafico salia del contenedor hacia el host y volvia a entrar, y esa vuelta
    # no se completa para los servicios que ya estan en la misma red.
    kuma-vpn:
      loadBalancer:
        servers: [{ url: "http://uptime-kuma:3001" }]
    beszel-vpn:
      loadBalancer:
        servers: [{ url: "http://10.8.0.1:8090" }]

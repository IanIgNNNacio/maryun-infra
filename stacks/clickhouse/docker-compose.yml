name: clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.26.3
    container_name: clickhouse
    hostname: clickhouse
    restart: unless-stopped

    # Solo accesible por la VPN. Nada en 0.0.0.0.
    ports:
      - "10.8.0.1:8123:8123"
      - "10.8.0.1:9000:9000"

    volumes:
      - /srv/stacks/clickhouse/data:/var/lib/clickhouse
      - /srv/stacks/clickhouse/logs:/var/log/clickhouse-server
      # Destino del comando BACKUP nativo
      - /srv/backups/clickhouse:/backups
      - /srv/stacks/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - /srv/stacks/clickhouse/users.d:/etc/clickhouse-server/users.d:ro

    ulimits:
      nofile:
        soft: 262144
        hard: 262144

    # Techo duro: ClickHouse no puede ahogar al ERP.
    deploy:
      resources:
        limits:
          memory: 24G

    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

    networks:
      - data

networks:
  data:
    name: data
    external: true

; php.ini de MySis en maryun01.
;
; NO ES UNA SELECCIÓN A OJO. Sale de leer el php.ini de Apache de la VM de
; Azure —`/etc/php/7.4/apache2/php.ini`— y reproducir sus valores. Esa
; distinción importa: Azure tiene DOS php.ini, el de Apache y el de CLI, y
; difieren. Las páginas usan el de Apache; los siete cron usan el de CLI.
;
; La imagen oficial de PHP NO TRAE NINGÚN php.ini: sólo `conf.d`. Así que todo
; lo que Debian daba por sentado hay que ponerlo aquí a mano. Eso costó el
; primer login fallido, y está explicado abajo.

; ── output_buffering: lo que hacía que no se pudiera entrar ──────────────────
;
; `pages/login.php` tiene `<!DOCTYPE html>` en la línea 1, ANTES del `<?php`.
; Eso es salida, así que para cuando llega el `session_start()` de la línea 6
; las cabeceras ya se enviaron y la cookie de sesión no se puede poner. El
; `ob_start()` de la línea 3 no ayuda: llega tarde.
;
; En Azure funciona porque Debian trae `output_buffering = 4096` y el DOCTYPE
; cae en el búfer. En la imagen oficial el valor es 0, y el resultado era un
; login que devolvía 200, redirigía a principal.php, y dejaba la sesión vacía —
; con `Undefined variable: user_menu` y una consulta rota en menu.php como
; único rastro. El síntoma no señalaba a la causa por ninguna parte.
output_buffering = 4096
implicit_flush = Off

; ── Lo que se copia de Azure tal cual ───────────────────────────────────────
max_execution_time = 300
max_input_time = 600
memory_limit = 256M
post_max_size = 8M
upload_max_filesize = 10M
max_file_uploads = 20

; `variables_order` sin la E: Debian deja fuera $_ENV a propósito. Con EGPCS
; —el valor por defecto de la imagen— las variables de entorno del contenedor,
; que incluyen la credencial de la base, quedarían visibles en $_ENV para
; cualquier página. No es teórico: aquí la contraseña entra por entorno.
variables_order = "GPCS"
request_order = "GP"
register_argc_argv = Off
auto_globals_jit = On

serialize_precision = -1
default_charset = "UTF-8"
default_mimetype = "text/html"
default_socket_timeout = 60
allow_url_fopen = On
allow_url_include = Off
enable_dl = Off
file_uploads = On
expose_php = Off
zend.enable_gc = On
zend.exception_ignore_args = On

; Las funciones de pcntl están DESHABILITADAS en Azure aunque la extensión esté
; cargada. Se reproduce: es la lista de Debian, y alguna página que llame a
; pcntl_fork por descuido debe fallar igual aquí que allá.
disable_functions = pcntl_alarm,pcntl_fork,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_get_handler,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_exec,pcntl_getpriority,pcntl_setpriority,pcntl_async_signals,pcntl_unshare

; ── Errores: a la bitácora, nunca a la salida ───────────────────────────────
;
; Los mismos niveles que Azure. `display_errors = Off` no es sólo higiene: con
; el DOCTYPE de la línea 1, un aviso impreso sería más salida antes de las
; cabeceras, o peor, un aviso colado dentro de un JSON o de un PDF.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
log_errors_max_len = 1024
report_memleaks = On
; A stderr y no a un archivo: así sale por `docker logs`, que es donde se mira
; en esta máquina.
error_log = /dev/stderr

; ── Sesión ──────────────────────────────────────────────────────────────────
;
; login.php hace `ini_set` de estos dos en sus líneas 4 y 5. Poniéndolos aquí,
; ese ini_set deja de ser el que decide y la sesión dura lo mismo aunque un día
; alguien toque el archivo.
session.cookie_lifetime = 86400
session.gc_maxlifetime = 86400

; ── La zona horaria ─────────────────────────────────────────────────────────
;
; Azure SÍ la tiene puesta en el php.ini de Apache: America/Santiago. Lo que no
; la tiene es el php.ini de CLI, y por eso los SIETE CRON la adivinan y les sale
; America/Halifax — una hora de desfase respecto de Chile que nadie ha notado
; porque es constante.
;
; Aquí se fija en los dos sitios. OJO AL RECREAR LOS CRON: van a ver otra hora
; que en Azure. Hay que revisar qué ventana de fechas calcula cada uno antes de
; dar la mudanza por buena.
date.timezone = America/Santiago

; ── Correo ──────────────────────────────────────────────────────────────────
;
; Azure manda por sendmail local en localhost:25. En este contenedor NO HAY
; sendmail, así que cualquier `mail()` va a fallar en silencio. Es deliberado
; mientras se prueba: no se quiere que una pantalla mande correo de verdad a un
; cliente desde el entorno nuevo. Resolverlo es parte del corte.
SMTP = localhost
smtp_port = 25
mail.add_x_header = Off

; ── OPcache ─────────────────────────────────────────────────────────────────
;
; En Azure está cargado. Sin él, PHP 7.4 recompila los 61.050 archivos en cada
; petición. Se deja con revalidación por tiempo y no desactivada: el despliegue
; es un `git pull` sobre el volumen montado, así que el código cambia sin
; reiniciar el contenedor y OPcache tiene que enterarse solo.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; 61.050 archivos de código; el primo por encima evita colisiones de hash.
opcache.max_accelerated_files = 65407
opcache.validate_timestamps = 1
opcache.revalidate_freq = 15

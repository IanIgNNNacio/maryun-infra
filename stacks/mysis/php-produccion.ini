; php.ini de MySis en maryun01.
;
; Sale de comparar `php -i` de la VM de Azure contra los valores por defecto de
; la imagen. Sólo está lo que difiere y lo que importa; el resto se deja como
; viene, que es lo que menos sorpresas da.

; ── La zona horaria, que es lo único que puede corromper datos ───────────────
;
; En Azure `date.timezone` NO está puesto y PHP lo adivina: sale
; America/Halifax. Los cron de bancos, Fintoc y el cargador de reportes calculan
; ventanas de fechas con esa zona, así que hoy trabajan con un desfase de una
; hora respecto de Chile y nadie lo ha notado porque es constante.
;
; Aquí se fija explícitamente. OJO AL MIGRAR: los cron que hoy asumen Halifax
; van a ver otra hora. Hay que revisar uno por uno qué ventana calculan antes de
; dar la mudanza por buena; está anotado en docs/migracion-mysis-a-ovh.md.
date.timezone = America/Santiago

; ── Memoria y tiempo ────────────────────────────────────────────────────────
;
; Producción tiene memory_limit = -1 en CLI, o sea sin límite. Aquí no: esta
; máquina ya no es de MySis sola —comparte con el ERP, tres Postgres,
; ClickHouse y Metabase—, y una página desbocada sin techo se lleva por delante
; al vecino. 512M es holgado para lo que hace (el proceso de Apache más gordo
; medido en Azure ocupaba 20 MB) y sigue siendo un techo.
memory_limit = 512M

; Las páginas de reportes de MySis son lentas y algunas tardan de verdad. 300 s
; es lo que la imagen trae de serie para web; se deja y se mide después, que es
; el orden acordado.
max_execution_time = 300

; ── Subidas ─────────────────────────────────────────────────────────────────
;
; Idénticos a producción. No se suben más grandes.
upload_max_filesize = 2M
post_max_size = 8M

; ── OPcache ─────────────────────────────────────────────────────────────────
;
; En Azure está cargado, y sin él PHP 7.4 recompila los 61.050 archivos en cada
; petición. Se deja con revalidación por tiempo y no desactivada: el despliegue
; es un `git pull` sobre el volumen montado, así que el código cambia sin
; reiniciar el contenedor y OPcache tiene que enterarse solo.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
; 61.050 archivos de código; el primo por encima evita colisiones de hash.
opcache.max_accelerated_files = 65407
opcache.validate_timestamps = 1
opcache.revalidate_freq = 15

; ── Errores ─────────────────────────────────────────────────────────────────
;
; A la bitácora y NUNCA a la salida. En Azure van a error.log de Apache, que es
; lo correcto; lo que no se puede permitir es que un aviso de PHP se cuele
; dentro de un JSON o de un PDF y lo rompa.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

name: metabase

# Metabase en v0.63.16. Se subio desde la v0.60.26 -el major del VPS viejo- porque
# el 60 llegaba a fin de vida el 2026-09-01. La edicion es la abierta: la imagen es
# metabase/metabase y no metabase-enterprise, asi que SAML, JWT y el sandbox por
# filas no estan disponibles. Para SSO de Microsoft hace falta una puerta delante.
# el 2026-09-01 — actualizar a la 63 en cuanto se verifique que todo funciona.
#
# Sin credenciales en este archivo: todas viven en /srv/secrets/metabase.env.
# En el VPS viejo estaban en texto plano aqui, y este archivo estaba en 644.

services:
  metabase-db:
    image: postgres:16
    container_name: metabase-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MB_DB_DBNAME}
      POSTGRES_USER: ${MB_DB_USER}
      POSTGRES_PASSWORD: ${MB_DB_PASS}
      TZ: ${TZ}
    volumes:
      - /srv/stacks/metabase/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MB_DB_USER} -d ${MB_DB_DBNAME}"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 2G
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }
    networks: [data]

  metabase:
    image: metabase/metabase:v0.63.16
    container_name: metabase
    restart: unless-stopped

    # Solo por la VPN.
    ports:
      - "10.8.0.1:3000:3000"

    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${MB_DB_DBNAME}
      MB_DB_USER: ${MB_DB_USER}
      MB_DB_PASS: ${MB_DB_PASS}
      TZ: ${TZ}
      # En el VPS viejo la JVM tomaba 11.5 GB porque no habia techo.
      JAVA_OPTS: "-Xmx4g"
      # Minimo de contrasena. Por defecto son 6 caracteres y un digito, que era
      # aceptable mientras esto solo se alcanzaba por la VPN; desde que
      # metabase.maryun.cl resuelve a la IP publica, no. No se puede cambiar por
      # la API -el PUT da 500 sin tocar la base- porque solo se lee de aqui.
      #
      # OJO: no invalida las contrasenas que ya existen. Solo se aplica a las
      # nuevas y a los cambios, asi que hay que pedir el cambio a quien tenga una
      # debil.
      MB_PASSWORD_COMPLEXITY: strong

    depends_on:
      metabase-db:
        condition: service_healthy

    volumes:
      - /srv/stacks/metabase/data:/metabase-data

    deploy:
      resources:
        limits:
          memory: 6G

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

    networks: [data]

networks:
  data:
    name: data
    external: true

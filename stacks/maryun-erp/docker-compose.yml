name: maryun-erp-db

# La base del ERP vive FUERA de Coolify a proposito: es el activo mas valioso
# del sistema y su ciclo de vida debe ser explicito. Las aplicaciones
# (produccion y preview) si van en Coolify.
#
# Aloja dos bases:
#   maryun_erp          -> produccion
#   maryun_erp_preview  -> preview
#
# PITR (recuperacion a un instante cualquiera): montado el 4-sep-2026. El
# archivado continuo de WAL va a /srv/pitr con pgBackRest y de ahi sale cifrado
# a R2. Detalle y operacion en /srv/bin/pitr.sh y en SERVIDOR.md.

services:
  db:
    # Imagen propia: postgres:18.6 + pgbackrest. archive_command lo ejecuta el
    # motor dentro del contenedor, asi que la herramienta tiene que estar ahi.
    # Se construye con: docker compose build
    build:
      context: .
      dockerfile: Dockerfile
    image: maryun/postgres-pgbackrest:18.6
    container_name: maryun-erp-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}

    # Solo por la VPN: para pgAdmin/DBeaver y para operaciones manuales.
    # Las aplicaciones la alcanzan por la red Docker con el nombre "maryun-erp-db".
    ports:
      - "10.8.0.1:5433:5432"

    volumes:
      - /srv/stacks/maryun-erp/db:/var/lib/postgresql
      # Repositorio de PITR: copias base + todo el WAL archivado.
      - /srv/pitr:/var/lib/pgbackrest
      - /srv/stacks/maryun-erp/pgbackrest:/etc/pgbackrest:ro
      - /srv/stacks/maryun-erp/log-pgbackrest:/var/log/pgbackrest

    # Ajustes conservadores. La base entera son 292 MB, asi que cabe holgada en
    # memoria; lo que se busca es evitar los valores por defecto, que asumen un
    # servidor diminuto.
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "log_min_duration_statement=2000"

      # ---- archivado continuo de WAL (PITR) --------------------------------
      # wal_level=replica ya basta para archivar; no hace falta 'logical'.
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=pgbackrest --stanza=maryun archive-push %p"
      # Fuerza un cambio de segmento cada 60 s cuando ha habido escrituras. Sin
      # esto habria que esperar a que el segmento de 16 MB se llenara, y la
      # ventana de perdida seria de decenas de minutos en vez de un minuto. El
      # coste es despreciable: un segmento casi vacio comprime a unos pocos KB.
      - "-c"
      - "archive_timeout=60"
      # Comprime las paginas completas dentro del propio WAL: menos bytes que
      # archivar, a cambio de muy poca CPU.
      - "-c"
      - "wal_compression=lz4"
      # restore_command NO se pone aqui a proposito: solo sirve durante una
      # recuperacion, y en ese caso lo escribe el propio pgbackrest en
      # postgresql.auto.conf al restaurar.

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

    deploy:
      resources:
        limits:
          memory: 8G

    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "3" }

    networks: [data, coolify]

networks:
  data:
    name: data
    external: true
  # Red de Coolify: las aplicaciones que gestiona viven ahi y necesitan
  # alcanzar esta base por su nombre de contenedor.
  coolify:
    name: coolify
    external: true

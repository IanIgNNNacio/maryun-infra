# pgBackRest para la base del ERP.  Se monta de solo lectura en /etc/pgbackrest.
#
# El repositorio local (/srv/pitr en el anfitrion) es la fuente de la que se
# restaura y la unica que toca archive_command. La copia fuera del servidor la
# hace un script aparte con rclone: asi un fallo de red NUNCA puede atascar el
# archivado y llenar el disco, que es el modo de fallo clasico de PITR.
[global]
repo1-path=/var/lib/pgbackrest
repo1-bundle=y
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=14

compress-type=zst
compress-level=6
process-max=4
start-fast=y
delta=y

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[global:archive-push]
process-max=2

[maryun]
pg1-path=/var/lib/postgresql/18/docker
pg1-port=5432
pg1-user=maryun
pg1-database=postgres
